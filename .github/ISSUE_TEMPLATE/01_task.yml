name: "📋 Task"
description: "Create a new task for the Epstein Files Pipeline"
title: "📋 [TASK] "
labels: ["task", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template for creating new tasks that need to be completed in the Epstein Files Pipeline project.

  - type: input
    id: task-id
    attributes:
      label: "Task ID"
      description: "Unique identifier for this task (e.g., M6-T01, ENH-001)"
      placeholder: "e.g., M6-T01"
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: "Milestone/Epic"
      description: "Which milestone or epic does this task belong to?"
      placeholder: "e.g., M5, M6, Enhancement"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Task Description"
      description: "Clear and concise description of what needs to be done"
      placeholder: "Describe the task that needs to be completed..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "What needs to be true for this task to be considered complete?"
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "How important is this task?"
      options:
        - "P0 - Critical (blocks major milestones)"
        - "P1 - High (important for current sprint)"
        - "P2 - Medium (nice to have)"
        - "P3 - Low (future enhancement)"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: "Estimated Complexity"
      description: "How complex is this task to implement?"
      options:
        - "XS - Less than 1 day"
        - "S - 1-3 days"
        - "M - 1-2 weeks"
        - "L - 2-4 weeks"
        - "XL - More than 1 month"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "What tasks or components does this depend on?"
      placeholder: "List any dependencies or blockers..."

  - type: textarea
    id: technical-notes
    attributes:
      label: "Technical Notes"
      description: "Any technical considerations, implementation hints, or relevant code paths"
      placeholder: "Technical details, relevant files, APIs, etc."

  - type: textarea
    id: testing-notes
    attributes:
      label: "Testing Requirements"
      description: "What testing is needed for this task?"
      placeholder: |
        - Unit tests required
        - Integration tests needed
        - Manual testing scenarios
        - Performance testing considerations

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Any other relevant information, links, or context"
      placeholder: "Screenshots, links to relevant issues, design docs, etc."
