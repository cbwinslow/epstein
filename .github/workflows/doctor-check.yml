name: Doctor check

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  doctor:
    name: Run scripts/doctor.py (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip || true
          # Install common deps used by doctor.py; skip if not present
          python -m pip install requests pytest psycopg[binary] || true

      - name: Run doctor checks (including Postgres reachability)
        run: |
          python scripts/doctor.py --check-db
          pytest tests/test_doctor_db.py -q
        env:
          QDRANT_PORT: ${{ secrets.QDRANT_PORT }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          EPSTEIN_DSN: ${{ secrets.EPSTEIN_DSN }}
