name: OCR Processing Workflow

# This workflow downloads Epstein-related documents from official government sources
# and processes them with OCR (Optical Character Recognition) to make them searchable.
# The processed documents can be stored in multiple locations based on configuration.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Document sources to download (comma-separated: doj,fbi,house,all)'
        required: true
        default: 'all'
        type: string
      enable_ocr:
        description: 'Enable OCR processing'
        required: true
        default: true
        type: boolean
      upload_to_r2:
        description: 'Upload results to Cloudflare R2'
        required: false
        default: false
        type: boolean
      max_documents:
        description: 'Maximum number of documents to process (0 = unlimited)'
        required: false
        default: 0
        type: number
      create_release:
        description: 'Create GitHub release with results'
        required: false
        default: false
        type: boolean
  
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  
  # Allow manual trigger from other workflows
  repository_dispatch:
    types: [ocr-processing]

env:
  PYTHON_VERSION: '3.10'
  ARTIFACTS_DIR: ./epstein_artifacts
  RESULTS_DIR: ./ocr_results
  MANIFEST_DIR: ./manifests

jobs:
  # Job 1: Download documents from official sources
  download-documents:
    name: Download Documents
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    outputs:
      download-count: ${{ steps.count.outputs.total }}
      manifest-path: ${{ steps.download.outputs.manifest }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget curl jq git ca-certificates
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml tqdm pydantic
      
      - name: Start MCP Server
        run: |
          cd mcp_servers/epstein_files_downloader
          pip install -r requirements.txt
          
          # Start server in background
          python server.py --port 8765 --download-dir ${ARTIFACTS_DIR}/downloads &
          SERVER_PID=$!
          echo "MCP_SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to start
          for i in {1..30}; do
            if curl -s http://localhost:8765/health > /dev/null; then
              echo "✅ MCP server started successfully"
              break
            fi
            echo "⏳ Waiting for MCP server to start... ($i/30)"
            sleep 2
          done
        timeout-minutes: 2
      
      - name: Discover and download documents
        id: download
        run: |
          set -e
          
          SOURCES="${{ github.event.inputs.sources || 'all' }}"
          MAX_DOCS="${{ github.event.inputs.max_documents || 0 }}"
          
          echo "📥 Downloading documents from sources: $SOURCES"
          echo "📊 Max documents: $MAX_DOCS (0 = unlimited)"
          
          mkdir -p ${ARTIFACTS_DIR}/downloads ${MANIFEST_DIR}
          
          # Use the MCP server API to download documents
          python << 'PYTHON_SCRIPT'
          import os
          import sys
          import json
          import time
          import requests
          from pathlib import Path
          
          MCP_URL = "http://localhost:8765"
          SOURCES = "${{ github.event.inputs.sources || 'all' }}".split(',')
          MAX_DOCS = int("${{ github.event.inputs.max_documents || 0 }}")
          MANIFEST_DIR = Path("${{ env.MANIFEST_DIR }}")
          
          def get_collections():
              """Get available document collections"""
              response = requests.get(f"{MCP_URL}/collections")
              response.raise_for_status()
              return response.json()
          
          def download_collection(collection_id, max_docs=0):
              """Download documents from a collection"""
              print(f"📦 Processing collection: {collection_id}")
              
              # Get documents in collection
              response = requests.get(f"{MCP_URL}/collections/{collection_id}/documents")
              response.raise_for_status()
              documents = response.json()
              
              print(f"   Found {len(documents)} documents")
              
              # Limit documents if specified
              if max_docs > 0:
                  documents = documents[:max_docs]
                  print(f"   Limited to {len(documents)} documents")
              
              # Start bulk download
              bulk_request = {
                  "collection_id": collection_id,
                  "destination": "${{ env.ARTIFACTS_DIR }}/downloads"
              }
              
              response = requests.post(
                  f"{MCP_URL}/download/bulk",
                  json=bulk_request
              )
              response.raise_for_status()
              tasks = response.json()
              
              print(f"   Started {len(tasks)} download tasks")
              
              # Monitor download progress
              completed = 0
              failed = 0
              
              for task in tasks:
                  task_id = task['task_id']
                  
                  # Poll task status
                  while True:
                      status_response = requests.get(f"{MCP_URL}/download/status/{task_id}")
                      status = status_response.json()
                      
                      if status['status'] == 'completed':
                          completed += 1
                          print(f"   ✅ Completed: {status['destination']}")
                          break
                      elif status['status'] == 'failed':
                          failed += 1
                          print(f"   ❌ Failed: {status.get('error', 'Unknown error')}")
                          break
                      
                      time.sleep(2)
              
              print(f"   📊 Summary: {completed} completed, {failed} failed")
              return completed, failed
          
          # Main download logic
          try:
              collections = get_collections()
              print(f"🔍 Found {len(collections)} collections")
              
              total_downloaded = 0
              total_failed = 0
              
              # Filter collections based on sources
              if "all" in SOURCES:
                  selected_collections = collections
              else:
                  selected_collections = [
                      c for c in collections
                      if any(source.lower() in c['collection_id'].lower() for source in SOURCES)
                  ]
              
              print(f"📋 Selected {len(selected_collections)} collections to process")
              
              # Process each collection
              for collection in selected_collections:
                  collection_id = collection['collection_id']
                  completed, failed = download_collection(collection_id, MAX_DOCS)
                  total_downloaded += completed
                  total_failed += failed
              
              # Save summary
              summary = {
                  "total_downloaded": total_downloaded,
                  "total_failed": total_failed,
                  "sources": SOURCES,
                  "timestamp": time.time()
              }
              
              manifest_path = MANIFEST_DIR / "download_summary.json"
              manifest_path.write_text(json.dumps(summary, indent=2))
              
              print(f"\n📊 Final Summary:")
              print(f"   ✅ Total downloaded: {total_downloaded}")
              print(f"   ❌ Total failed: {total_failed}")
              
              # Output for GitHub Actions
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"total={total_downloaded}\n")
                  f.write(f"manifest={manifest_path}\n")
              
              # Exit with error if all downloads failed
              if total_downloaded == 0 and total_failed > 0:
                  sys.exit(1)
              
          except Exception as e:
              print(f"❌ Error during download: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          PYTHON_SCRIPT
      
      - name: Count downloaded documents
        id: count
        run: |
          COUNT=$(find ${ARTIFACTS_DIR}/downloads -type f -name "*.pdf" | wc -l)
          echo "total=$COUNT" >> $GITHUB_OUTPUT
          echo "📊 Downloaded $COUNT PDF documents"
      
      - name: Upload download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-documents
          path: |
            ${{ env.ARTIFACTS_DIR }}/downloads/
            ${{ env.MANIFEST_DIR }}/download_summary.json
          retention-days: 7
          if-no-files-found: warn
      
      - name: Stop MCP Server
        if: always()
        run: |
          if [ ! -z "$MCP_SERVER_PID" ]; then
            kill $MCP_SERVER_PID || true
          fi
  
  # Job 2: OCR Processing
  ocr-processing:
    name: OCR Processing
    needs: download-documents
    if: ${{ github.event.inputs.enable_ocr != 'false' && needs.download-documents.outputs.download-count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    outputs:
      processed-count: ${{ steps.ocr.outputs.processed }}
      manifest-path: ${{ steps.ocr.outputs.manifest }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifacts from previous job
        uses: actions/download-artifact@v4
        with:
          name: downloaded-documents
          path: ${{ env.ARTIFACTS_DIR }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies for OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ocrmypdf \
            tesseract-ocr \
            tesseract-ocr-eng \
            ghostscript \
            qpdf \
            poppler-utils
          
          # Verify installations
          ocrmypdf --version
          tesseract --version
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r epstein/pyproject.toml || true
          pip install requests beautifulsoup4 lxml tqdm pydantic pdfminer.six spacy
          python -m spacy download en_core_web_sm
      
      - name: Create pipeline configuration
        run: |
          cat > ${ARTIFACTS_DIR}/config.json << 'EOF'
          {
            "seed_urls": [],
            "output_dir": "${{ env.RESULTS_DIR }}",
            "enable_ocr": true,
            "ocrmypdf_lang": "eng",
            "ocrmypdf_extra_args": ["--skip-text", "--rotate-pages", "--optimize 1"],
            "spacy_model": "en_core_web_sm",
            "chunk_chars": 10000,
            "chunk_overlap_chars": 1500,
            "redact_emails": false,
            "redact_phones": false,
            "redact_ssns": false,
            "max_workers": 4,
            "polite_delay_seconds": 0
          }
          EOF
          
          echo "📄 Created pipeline configuration"
          cat ${ARTIFACTS_DIR}/config.json
      
      - name: Run OCR processing
        id: ocr
        run: |
          set -e
          
          echo "🔧 Starting OCR processing pipeline"
          
          mkdir -p ${RESULTS_DIR}/{ocr,text,entities}
          
          # Copy the pipeline script
          cp epstein/epstein_files_download_ocr_ner_pipeline_python_optional_ts.py ./ocr_pipeline.py
          
          # Process PDFs with OCR
          PROCESSED=0
          FAILED=0
          
          for pdf in ${ARTIFACTS_DIR}/downloads/*.pdf; do
            if [ ! -f "$pdf" ]; then
              continue
            fi
            
            FILENAME=$(basename "$pdf")
            BASENAME="${FILENAME%.*}"
            
            echo "📄 Processing: $FILENAME"
            
            # OCR the PDF
            ocrmypdf \
              --language eng \
              --skip-text \
              --rotate-pages \
              --optimize 1 \
              --jobs 2 \
              "$pdf" \
              "${RESULTS_DIR}/ocr/${FILENAME}" \
              && echo "   ✅ OCR completed" \
              || { echo "   ⚠️  OCR failed, using original"; cp "$pdf" "${RESULTS_DIR}/ocr/${FILENAME}"; }
            
            # Extract text
            python -m pdfminer.six "$pdf" > "${RESULTS_DIR}/text/${BASENAME}.txt" 2>/dev/null \
              && echo "   ✅ Text extracted" \
              || echo "   ⚠️  Text extraction failed"
            
            PROCESSED=$((PROCESSED + 1))
            
            # Progress indicator
            if [ $((PROCESSED % 10)) -eq 0 ]; then
              echo "📊 Progress: $PROCESSED documents processed"
            fi
          done
          
          echo "📊 OCR Processing Summary:"
          echo "   ✅ Processed: $PROCESSED documents"
          echo "   📁 OCR PDFs: $(find ${RESULTS_DIR}/ocr -type f | wc -l)"
          echo "   📝 Text files: $(find ${RESULTS_DIR}/text -type f | wc -l)"
          
          # Generate manifest
          python << 'PYTHON_MANIFEST'
          import os
          import sys
          import json
          import hashlib
          import time
          from pathlib import Path
          
          results_dir = Path("${{ env.RESULTS_DIR }}")
          manifest_dir = Path("${{ env.MANIFEST_DIR }}")
          manifest_dir.mkdir(exist_ok=True)
          
          manifest = {
              "processing_date": time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime()),
              "workflow_run": "${{ github.run_id }}",
              "documents": []
          }
          
          for ocr_file in sorted((results_dir / "ocr").glob("*.pdf")):
              # Calculate SHA-256
              sha256 = hashlib.sha256()
              with open(ocr_file, 'rb') as f:
                  for chunk in iter(lambda: f.read(8192), b''):
                      sha256.update(chunk)
              
              doc_info = {
                  "filename": ocr_file.name,
                  "path": str(ocr_file.relative_to(results_dir)),
                  "size": ocr_file.stat().st_size,
                  "sha256": sha256.hexdigest()
              }
              
              # Check for corresponding text file
              text_file = results_dir / "text" / f"{ocr_file.stem}.txt"
              if text_file.exists():
                  doc_info["text_file"] = str(text_file.relative_to(results_dir))
                  doc_info["text_size"] = text_file.stat().st_size
              
              manifest["documents"].append(doc_info)
          
          manifest["total_documents"] = len(manifest["documents"])
          manifest_path = manifest_dir / "ocr_manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2))
          
          print(f"📋 Manifest created: {manifest_path}")
          print(f"📊 Total documents in manifest: {manifest['total_documents']}")
          
          # Output for GitHub Actions
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"processed={manifest['total_documents']}\n")
              f.write(f"manifest={manifest_path}\n")
          PYTHON_MANIFEST
      
      - name: Generate summary statistics
        run: |
          echo "## OCR Processing Results" > ${RESULTS_DIR}/SUMMARY.md
          echo "" >> ${RESULTS_DIR}/SUMMARY.md
          echo "**Processing Date:** $(date -u)" >> ${RESULTS_DIR}/SUMMARY.md
          echo "**Workflow Run:** ${{ github.run_id }}" >> ${RESULTS_DIR}/SUMMARY.md
          echo "" >> ${RESULTS_DIR}/SUMMARY.md
          echo "### Statistics" >> ${RESULTS_DIR}/SUMMARY.md
          echo "- **Total PDFs processed:** $(find ${RESULTS_DIR}/ocr -type f -name '*.pdf' | wc -l)" >> ${RESULTS_DIR}/SUMMARY.md
          echo "- **Total text files:** $(find ${RESULTS_DIR}/text -type f -name '*.txt' | wc -l)" >> ${RESULTS_DIR}/SUMMARY.md
          echo "- **Total storage:** $(du -sh ${RESULTS_DIR} | cut -f1)" >> ${RESULTS_DIR}/SUMMARY.md
          echo "" >> ${RESULTS_DIR}/SUMMARY.md
          echo "### Download Locations" >> ${RESULTS_DIR}/SUMMARY.md
          echo "- GitHub Actions Artifacts (90-day retention)" >> ${RESULTS_DIR}/SUMMARY.md
          echo "- See workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ${RESULTS_DIR}/SUMMARY.md
          
          cat ${RESULTS_DIR}/SUMMARY.md
      
      - name: Upload OCR results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr-processed-results
          path: |
            ${{ env.RESULTS_DIR }}/
            ${{ env.MANIFEST_DIR }}/ocr_manifest.json
          retention-days: 90
          compression-level: 9
      
      - name: Create compressed archive
        run: |
          cd ${RESULTS_DIR}
          tar -czf ../ocr-results-${{ github.run_id }}.tar.gz .
          cd ..
          echo "📦 Created archive: ocr-results-${{ github.run_id }}.tar.gz"
          ls -lh ocr-results-${{ github.run_id }}.tar.gz
      
      - name: Upload compressed archive
        uses: actions/upload-artifact@v4
        with:
          name: ocr-results-archive
          path: ocr-results-${{ github.run_id }}.tar.gz
          retention-days: 90
  
  # Job 3: Upload to Cloudflare R2 (Optional)
  upload-to-r2:
    name: Upload to Cloudflare R2
    needs: ocr-processing
    if: |
      github.event.inputs.upload_to_r2 == 'true' &&
      needs.ocr-processing.outputs.processed-count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download OCR results
        uses: actions/download-artifact@v4
        with:
          name: ocr-results-archive
          path: ./
      
      - name: Install Wrangler CLI
        run: |
          npm install -g wrangler
          wrangler --version
      
      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET || 'epstein-documents' }}
        run: |
          set -e
          
          ARCHIVE_NAME="ocr-results-${{ github.run_id }}.tar.gz"
          R2_KEY="ocr-results/$(date +%Y%m%d)/${ARCHIVE_NAME}"
          
          echo "📤 Uploading to Cloudflare R2..."
          echo "   Bucket: ${R2_BUCKET}"
          echo "   Key: ${R2_KEY}"
          
          wrangler r2 object put "${R2_BUCKET}/${R2_KEY}" \
            --file "${ARCHIVE_NAME}" \
            --content-type "application/gzip"
          
          echo "✅ Upload complete!"
          echo "🔗 Public URL: https://pub-${CLOUDFLARE_ACCOUNT_ID}.r2.dev/${R2_KEY}"
          
          # Save URL for later use
          echo "R2_URL=https://pub-${CLOUDFLARE_ACCOUNT_ID}.r2.dev/${R2_KEY}" >> $GITHUB_ENV
      
      - name: Update repository with R2 links
        if: success()
        run: |
          mkdir -p results/r2-links
          
          cat > results/r2-links/latest.txt << EOF
          OCR Processing Results
          ======================
          Date: $(date -u)
          Workflow Run: ${{ github.run_id }}
          R2 URL: ${{ env.R2_URL }}
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/r2-links/latest.txt
          git commit -m "Add R2 link for OCR results from run ${{ github.run_id }}" || echo "No changes to commit"
          git push || echo "Push failed, continuing..."
  
  # Job 4: Create GitHub Release (Optional)
  create-release:
    name: Create GitHub Release
    needs: ocr-processing
    if: |
      github.event.inputs.create_release == 'true' &&
      needs.ocr-processing.outputs.processed-count > 0
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download OCR results archive
        uses: actions/download-artifact@v4
        with:
          name: ocr-results-archive
          path: ./
      
      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: ocr-processed-results
          path: ${{ env.RESULTS_DIR }}
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ocr-${{ github.run_number }}
          name: OCR Processing Results - Run ${{ github.run_number }}
          body: |
            # OCR Processing Results
            
            **Processing Date:** $(date -u)
            **Workflow Run:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Documents Processed:** ${{ needs.ocr-processing.outputs.processed-count }}
            
            ## Downloads
            
            - `ocr-results-${{ github.run_id }}.tar.gz` - Complete OCR results archive
            - `ocr_manifest.json` - Document manifest with checksums
            
            ## Source Information
            
            These documents were downloaded from official government sources:
            - Department of Justice (DOJ)
            - FBI Vault
            - House Oversight Committee
            
            All documents are public records.
            
            ## Processing Details
            
            - OCR Engine: OCRmyPDF + Tesseract
            - Language: English
            - Text extraction: PDFMiner.six
            
            For more information, see: https://github.com/${{ github.repository }}
          files: |
            ocr-results-${{ github.run_id }}.tar.gz
            ${{ env.RESULTS_DIR }}/SUMMARY.md
          draft: false
          prerelease: false
  
  # Job 5: Notification and Summary
  summary:
    name: Workflow Summary
    needs: [download-documents, ocr-processing]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate workflow summary
        run: |
          echo "# OCR Processing Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Started:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.download-documents.result }}" == "success" ]; then
            echo "✅ **Download:** ${{ needs.download-documents.outputs.download-count }} documents downloaded" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Download:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.ocr-processing.result }}" == "success" ]; then
            echo "✅ **OCR Processing:** ${{ needs.ocr-processing.outputs.processed-count }} documents processed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.ocr-processing.result }}" == "skipped" ]; then
            echo "⏭️ **OCR Processing:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **OCR Processing:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- Retention: 90 days" >> $GITHUB_STEP_SUMMARY
