name: Enforce runtime and lockfile

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  enforce-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.15'
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
+      - name: Check runtime file
+        run: |
+          python - <<'PY'
+          import json, sys
+          rt = json.load(open('.epstein_runtime.json'))
+          expected = rt.get('python')
+          if not sys.version.split()[0].startswith('.'.join(expected.split('.')[:2])):
+              print('Runtime mismatch: expected', expected, 'got', sys.version.split()[0])
+              sys.exit(1)
+          print('Runtime matches expected prefix:', expected)
+          PY
      - name: Validate uv.lock exists
        run: |
          if [ ! -f uv.lock ]; then
            echo "uv.lock missing; failing CI. Please run 'uv lock' and commit the lockfile.";
            exit 1;
          fi
      - name: Validate frozen lock installs
        run: uv install --frozen-lock --dry-run
      - name: Run tests
        run: pytest -q
