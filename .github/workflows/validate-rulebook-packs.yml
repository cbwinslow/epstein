name: Validate rulebook packs

on:
  pull_request:
    paths:
      - 'rulebook_packs/**'
  push:
    paths:
      - 'rulebook_packs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run pack validation
        run: |
          python scripts/validate_rulebook_packs.py

      - name: Run pack tests
        run: |
          pytest -q tests/test_validate_rulebook_packs.py tests/test_task_logger.py
