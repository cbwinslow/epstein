name: OCR Tests

on:
  pull_request:
  push:
    branches: [ 'sync-copilot-instructions', 'feat/ocr-runner' ]

jobs:
  ocr-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libtesseract-dev imagemagick
      - name: Install pip deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pillow
      - name: Run unit tests
        run: |
          pytest -q tests/test_chunking.py tests/test_ocr_runner_unit.py tests/test_pipeline_monitor.py tests/test_ocr_summary.py
      - name: Run integration (optional)
        if: ${{ success() }}
        run: |
          pytest -q tests/test_integration_ocr.py || echo 'Integration tests skipped or failed'