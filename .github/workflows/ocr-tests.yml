name: OCR Tests

on:
  pull_request:
  push:
    branches: [ 'sync-copilot-instructions', 'feat/ocr-runner' ]

jobs:
  ocr-tests:
    name: OCR Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libtesseract-dev imagemagick
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install poppler tesseract imagemagick || true
      - name: Install pip deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # Install package and its runtime dependencies from pyproject.toml
          pip install -e . || true
          # Test libs and lock utilities
          pip install pytest pillow portalocker psutil
      - name: Run unit tests
        run: |
          # include concurrency test to validate cross-process locking
          pytest -q tests/test_chunking.py tests/test_ocr_runner_unit.py tests/test_pipeline_monitor.py tests/test_ocr_summary.py tests/test_ocr_watch.py tests/test_ocr_runner_concurrent.py
      - name: Run integration (optional)
        if: ${{ success() }}
        run: |
          pytest -q tests/test_integration_ocr.py || echo 'Integration tests skipped or failed'