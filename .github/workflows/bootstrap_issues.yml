name: "Bootstrap Issues"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (preview only)"
        required: false
        default: true
        type: boolean
      create_issues:
        description: "Actually create the GitHub issues"
        required: false
        default: false
        type: boolean

jobs:
  bootstrap-issues:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyYAML requests

    - name: Generate issues from tasks
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/gen_issues_from_tasks.py \
          --in tasks/master_tasks.yml \
          --out-json issues.json \
          --out-md MASTER_TASKS.md \
          --dry-run=${{ github.event.inputs.dry_run || 'true' }} \
          --create-issues=${{ github.event.inputs.create_issues || 'false' }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: issue-generation-artifacts
        path: |
          issues.json
          MASTER_TASKS.md
        retention-days: 30

    - name: Comment on PR with summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('MASTER_TASKS.md')) {
            const content = fs.readFileSync('MASTER_TASKS.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Issues Bootstrap Summary\n\nGenerated ${content.split('- **task:').length - 1} tasks from master_tasks.yml\n\n<details>\n<summary>Click to view generated MASTER_TASKS.md</summary>\n\n${content}\n\n</details>`
            });
          }

    - name: Show summary
      run: |
        echo "## Issue Bootstrap Summary"
        echo "========================="
        if [ -f "MASTER_TASKS.md" ]; then
          echo "Generated $(grep -c 'task:' MASTER_TASKS.md) tasks from master_tasks.yml"
          echo ""
          echo "Generated files:"
          echo "- issues.json"
          echo "- MASTER_TASKS.md"
        else
          echo "No MASTER_TASKS.md generated"
        fi
