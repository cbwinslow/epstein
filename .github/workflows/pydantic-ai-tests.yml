name: PydanticAI Agent Tests

on:
  push:
    paths:
      - 'agents/**'
      - 'tests/test_pydantic_agents.py'
      - '.github/workflows/pydantic-ai-tests.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/test_pydantic_agents.py'
  workflow_dispatch:

jobs:
  test-pydantic-agents:
    name: Test PydanticAI Agents
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-ai pydantic pytest pytest-asyncio pytest-mock
          pip install -r mcp_servers/epstein_files_downloader/requirements.txt

      - name: Test Agent Creation
        run: |
          python -c "from pydantic_ai import Agent; print('✓ PydanticAI imported successfully')"

      - name: Run Agent Tests
        run: |
          pytest tests/test_pydantic_agents.py -v --tb=short

      - name: Test Agent Documentation
        run: |
          # Verify all agents have documentation
          python scripts/validate_agent_docs.py

  lint-agents:
    name: Lint Agent Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install ruff black mypy

      - name: Run Ruff
        run: |
          ruff check agents/ --output-format=github

      - name: Run Black
        run: |
          black --check agents/

      - name: Run MyPy
        run: |
          mypy agents/ --ignore-missing-imports
