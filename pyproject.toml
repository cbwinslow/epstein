[project]
name = "epstein-files-pipeline"
version = "0.1.0"
description = "Reproducible, provenance-safe PDF analysis pipeline (OCR/text/chunk/NER/embeddings)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tqdm>=4.66",
  "pydantic>=2.6",
  "pdfminer.six>=20231228",
  "spacy>=3.7",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.9",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version<'3.11'",
  "fastapi>=0.127.1",
  "uvicorn>=0.40.0",
  "aiohttp>=3.13.2",
  "python-multipart>=0.0.21",
  "loguru>=0.7.3",
  "portalocker>=2.8",
  "psutil>=5.9",
]


[tool.uv]
# Development dependencies (uv will install these into the dev venv when bootstrapping)
# Note: `tool.uv.dev-dependencies` is deprecated in newer uv versions; consider
# migrating to `dependency-groups.dev` when updating project tooling.
dev-dependencies = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=7.0",
  "pytest-mock>=3.11",
  "PyYAML>=6.0",
  "coverage>=6.5",
  "black>=24.1",
  "pre-commit>=3.4",
]


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["epstein_artifacts", "vector-stack", ".epstein"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
