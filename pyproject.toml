[project]
name = "epstein-files-pipeline"
version = "0.1.0"
description = "Reproducible, provenance-safe PDF analysis pipeline (OCR/text/chunk/NER/embeddings)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tqdm>=4.67.3",
  "pydantic>=2.6",
  "pdfminer.six>=20231228",
  "spacy>=3.7",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.9",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version<'3.11'",
  "fastapi>=0.127.1",
  "uvicorn>=0.40.0",
  "aiohttp>=3.13.2",
  "python-multipart>=0.0.21",
  "loguru>=0.7.3",
  "textual>=7.0.0",
  "rich>=14.2.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=7.0",
  "pytest-mock>=3.11",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.21",
  "PyYAML>=6.0",
  "coverage>=6.5",
  "black>=24.1",
  "pre-commit>=3.4",
  "pdfplumber>=0.10",
  "pytesseract>=0.3",
  "psycopg2-binary>=2.9",
  "qdrant-client>=1.9",
]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["epstein", "agents", "lib", "tools"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/epstein/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["epstein_artifacts", "vector-stack", ".epstein"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","W"]
ignore = [
    "E501",  # Line too long
    "E101",  # Mixed tabs/spaces (in embedded code)
    "E402",  # Import not at top
    "E722",  # Bare except
    "E741",  # Ambiguous variable
    "SIM102", # Nested if
    "SIM117", # Nested with
    "B007",   # Unused loop var
    "B018",   # Useless expression
    "B904",   # Except raise
    "F404",   # Future import position
    "F811",   # Redefinition
    "F821",   # Undefined name
]
extend-exclude = [
    "epstein/qdrant_embed_chunks.py",
    "tests/",
    "scripts/",
    "epstein/",
]
filterwarnings = [
    "ignore::pytest.PytestUnhandledLoopWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
