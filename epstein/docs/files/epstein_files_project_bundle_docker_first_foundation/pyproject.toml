[project]
name = "epstein-files-pipeline"
version = "0.1.0"
description = "Reproducible, provenance-safe PDF analysis pipeline (OCR/text/chunk/NER/embeddings)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tqdm>=4.66",
  "pydantic>=2.6",
  "pdfminer.six>=20231228",
  "spacy>=3.7",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.9",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version<'3.11'",
]

[tool.uv]
dev-dependencies = ["ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["epstein_artifacts", "vector-stack", ".epstein"]

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM","W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true