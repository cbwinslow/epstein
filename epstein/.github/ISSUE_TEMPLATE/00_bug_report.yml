name: "🐛 Bug Report"
description: "Report a bug in the Epstein Files Pipeline"
title: "🐛 [BUG] "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the issue you're experiencing..."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
      placeholder: "Describe what should have happened..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Please provide step-by-step instructions to reproduce this issue."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment details"
      description: "Please provide details about your environment."
      placeholder: |
        - Operating System: [e.g. Ubuntu 20.04]
        - Python Version: [e.g. 3.11]
        - Pipeline Version: [e.g. v2.1.0]
        - Database: [e.g. PostgreSQL 14]
        - Other relevant tools: [e.g. Docker, Qdrant]

  - type: textarea
    id: logs
    attributes:
      label: "Relevant logs"
      description: "Please paste any relevant log output here."
      placeholder: "Paste log output here..."

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How severely does this bug affect you?"
      options:
        - "Low - Minimal impact"
        - "Medium - Some functionality affected"
        - "High - Core functionality broken"
        - "Critical - System unusable"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      description: "Please confirm you've completed these steps:"
      options:
        - label: "I have searched for existing issues"
          required: true
        - label: "I have checked the documentation"
          required: true
        - label: "I am using the latest version"
          required: true
